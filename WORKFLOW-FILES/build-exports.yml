name: Build UTM exports

on:
  push:
    branches: [main]
    paths:
      - 'data/records/**'
      - 'data/definitions.json'
      - 'scripts/build_exports.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utm-exports-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build CSV and Excel
        run: python scripts/build_exports.py

      - name: Commit generated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add exports/utm_history.csv exports/utm_history.xlsx

          if git diff --cached --quiet; then
            echo "No export changes"
          else
            git commit -m "Update UTM exports"
            git pull --rebase origin main
            python scripts/build_exports.py
            git add exports/utm_history.csv exports/utm_history.xlsx
            git commit --amend --no-edit
            git push
          fi
